<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Technical Search</title>
  <link href="/style.css" rel="stylesheet">
  <script src="/search.js" defer></script>
</head>
<body>
  <header>
    <h1>Technical Search</h1>
    <span id="corpus" class="meta"></span>
  </header>
  <main>
    <form id="form" autocomplete="off">
      <div class="searchline">
        <input id="query" type="search" aria-label="Search" placeholder="Search" maxlength="4000" required>
        <button id="search" type="submit">Search</button>
      </div>
      <label for="mode">Retrieval method</label>
      <select id="mode"></select>
    </form>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <section id="results" aria-label="Search results"></section>
    <nav id="pagination" aria-label="Result pages" hidden>
      <button id="prev" type="button">Previous</button>
      <span id="page"></span>
      <button id="next" type="button">Next</button>
    </nav>
  </main>
</body>
</html>
