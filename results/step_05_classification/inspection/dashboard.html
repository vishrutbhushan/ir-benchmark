<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>step 05 classification/inspection</title>
  <style>
    body { font: 16px system-ui; max-width: 1000px; margin: 40px auto;
           background: #f7fafb; color: #18313a; }
    td, th { text-align: left; padding: 8px; border-bottom: 1px solid #ccd; }
    input { padding: 12px; width: 95%; }
  </style>
</head>
<body>
  <h1>step 05 classification/inspection</h1>
  <label>Filter measurements <input id="filter" type="search"></label>
  <table><tr><th>documents</th><td>420</td></tr><tr><th>columns</th><td>[&#x27;doc_id&#x27;, &#x27;class_id&#x27;, &#x27;class_name&#x27;, &#x27;split&#x27;]</td></tr><tr><th>csv_bytes</th><td>19637</td></tr><tr><th>duplicate_grouping</th><td>Internal only; retained during split generation</td></tr><tr><th>all_text_labels_and_splits_preserved</th><td>True</td></tr><tr><th>existing_classifier_arrays_unchanged</th><td>True</td></tr></table>
  <figure><img style="max-width:100%" src="charts/rows_by_split.png"><figcaption>rows_by_split</figcaption></figure>
  <script>
    document.querySelector('#filter').oninput = event => {
      const query = event.target.value.toLowerCase();
      document.querySelectorAll('tr').forEach(row => {
        row.hidden = !row.textContent.toLowerCase().includes(query);
      });
    };
  </script>
</body>
</html>
