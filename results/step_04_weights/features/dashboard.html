<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Full-index zone learning features</title>
  <style>
    body { font: 16px system-ui; max-width: 1000px; margin: 40px auto;
           background: #f7fafb; color: #18313a; }
    td, th { text-align: left; padding: 8px; border-bottom: 1px solid #ccd; }
    input { padding: 12px; width: 95%; }
  </style>
</head>
<body>
  <h1>Full-index zone learning features</h1>
  <label>Filter measurements <input id="filter" type="search"></label>
  <table><tr><th>pairs</th><td>240</td></tr><tr><th>queries</th><td>60</td></tr><tr><th>index_fingerprint</th><td>6243a1e92060be87bf31c54ccd305fb375d9d3482a75b317b51886ef24f198cf</td></tr><tr><th>training_csv_sha256</th><td>86c856c863c19dc1c63de31a7063a3f57ef0865afb95d3eb3230cfb7af66e33d</td></tr></table>
  <figure><img style="max-width:100%" src="charts/pairs_by_split.png"><figcaption>pairs_by_split</figcaption></figure>
  <script>
    document.querySelector('#filter').oninput = event => {
      const query = event.target.value.toLowerCase();
      document.querySelectorAll('tr').forEach(row => {
        row.hidden = !row.textContent.toLowerCase().includes(query);
      });
    };
  </script>
</body>
</html>
