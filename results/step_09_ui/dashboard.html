<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Search UI verification</title>
  <style>
    body { font: 16px system-ui; max-width: 1000px; margin: 40px auto;
           background: #f7fafb; color: #18313a; }
    td, th { text-align: left; padding: 8px; border-bottom: 1px solid #ccd; }
    input { padding: 12px; width: 95%; }
  </style>
</head>
<body>
  <h1>Search UI verification</h1>
  <label>Filter measurements <input id="filter" type="search"></label>
  <table><tr><th>static_assets_verified</th><td>True</td></tr><tr><th>saved_html_verified</th><td>True</td></tr><tr><th>viewer_sandbox_verified</th><td>True</td></tr><tr><th>invalid_document_paths_rejected</th><td>True</td></tr><tr><th>routed_filter_verified</th><td>True</td></tr><tr><th>cached_pagination_verified</th><td>True</td></tr><tr><th>default_categories</th><td>3</td></tr><tr><th>candidate_documents</th><td>28442</td></tr><tr><th>scanned_vectors</th><td>175056</td></tr><tr><th>query_elapsed_ms</th><td>73.54</td></tr></table>
  <figure><img style="max-width:100%" src="charts/checks.png"><figcaption>checks</figcaption></figure>
  <script>
    document.querySelector('#filter').oninput = event => {
      const query = event.target.value.toLowerCase();
      document.querySelectorAll('tr').forEach(row => {
        row.hidden = !row.textContent.toLowerCase().includes(query);
      });
    };
  </script>
</body>
</html>
